name: Programacion V - Desplegar API

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # =========================================================================
      # PASO 1: Inicialización del entorno de trabajo y clonación del repositorio
      # Fetch del código fuente del proyecto para su posterior procesamiento.
      # =========================================================================
      - name: Descargar código
        uses: actions/checkout@v4

      # =========================================================================
      # PASO 2: Autenticación en el Registro de Contenedores de GitHub (GHCR)
      # Establece sesión segura mediante tokens de acceso para interactuar con GHCR.
      # =========================================================================
      - name: Login en GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

      # =========================================================================
      # PASO 3: Construcción de la imagen Docker (Build Context)
      # Compilación del Dockerfile ubicado en la raíz y etiquetado como 'latest'.
      # =========================================================================
      - name: Construir imagen Docker
        run: |
          docker build \
            -t ghcr.io/academia-universidad/programacionv-api:latest \
            .

      # =========================================================================
      # PASO 4: Publicación de artefactos en el Registro de Contenedores
      # Distribución de la imagen generada hacia GHCR para su distribución y despliegue.
      # =========================================================================
      - name: Publicar imagen en GHCR
        run: |
          docker push ghcr.io/academia-universidad/programacionv-api:latest

      # =========================================================================
      # PASO 5: Despliegue continuo en Servidor Virtual Privado (VPS) vía SSH
      # Orquestación remota para actualizar el contenedor en el entorno de producción.
      # =========================================================================
      - name: Desplegar en VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            IMAGE="ghcr.io/academia-universidad/programacionv-api:latest"
            NAME="programacionv-api"
            DATA_DIR="/opt/programacionv/Data"

            echo "===================================="
            echo "Verificando/Creando volumen de persistencia local"
            echo "===================================="
            mkdir -p "$DATA_DIR"

            echo "===================================="
            echo "Autenticando sesión de Docker en el host remoto (VPS)"
            echo "===================================="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "===================================="
            echo "Extrayendo la última versión de la imagen desde GHCR (Pull)"
            echo "===================================="
            docker pull "$IMAGE"

            echo "===================================="
            echo "Removiendo instancias previas del contenedor (Zero-Downtime Pipeline)"
            echo "===================================="
            docker stop "$NAME" 2>/dev/null || true
            docker rm "$NAME" 2>/dev/null || true

            echo "===================================="
            echo "Inicializando contenedor Docker con variables de entorno ASP.NET Core"
            echo "===================================="
            docker run -d \
              --name "$NAME" \
              --restart unless-stopped \
              -p 6090:8080 \
              -v "$DATA_DIR:/app/Data" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://+:8080 \
              "$IMAGE"

            echo "===================================="
            echo "Validando estado de ejecución del servicio (Health Check rudimentario)"
            echo "===================================="
            sleep 5
            docker ps --filter "name=$NAME"

            echo "===================================="
            echo "Pipeline de despliegue finalizado exitosamente"
            echo "===================================="
